[project]
name = "nix-darwin-config"
revision = "1.0"

[providers]
personal = { uri = "onepassword://", ref = { item = "nix-darwin-config", field = "{key}" } }

[profiles.personal]
OPENROUTER_API_KEY = { description = "OpenRouter key used by ai-memory and optional agents", required = true, providers = ["personal"] }
OPENAI_API_KEY = { description = "Optional OpenAI API key", required = false, providers = ["personal"] }
ANTHROPIC_API_KEY = { description = "Optional Anthropic API key", required = false, providers = ["personal"] }
GEMINI_API_KEY = { description = "Optional Gemini API key", required = false, providers = ["personal"] }
CLAUDEX_PROXY_TOKEN = { description = "Local CLIProxyAPI bearer token", required = true, providers = ["personal"] }

[scopes.claudex]
secrets = ["CLAUDEX_PROXY_TOKEN"]
